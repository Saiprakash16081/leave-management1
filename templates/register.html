<!DOCTYPE html>
<html>

<head>
    <title>Leave Management - Register</title>
</head>

<body>

    <h1>Leave Management System</h1>

    <h2>Create Account</h2>

    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}

    <form method="POST">

        <label>Name:</label>
        <input type="text" name="name" required>

        <br><br>

        <label>User ID:</label>
        <input
            type="text"
            name="username"
            inputmode="numeric"
            pattern="[0-9]+"
            maxlength="20"
            required
            oninput="this.value = this.value.replace(/[^0-9]/g, '')"
        >

        <br><br>

        <label>Password:</label>
        <input
            type="password"
            name="password"
            required
        >

        <br><br>

        <label>Role:</label>
        <select name="role">
            <option value="employee">Employee</option>
            <option value="hod">HOD</option>
        </select>

        <br><br>

        <button type="submit">
            Create Account
        </button>

    </form>

    <br>

    <a href="{{ url_for('login') }}">
        Already have an account? Login
    </a>

</body>

</html>
